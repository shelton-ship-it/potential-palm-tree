name: Android Build

# Monorepo: o projeto Android vive em android/ (rootProject "PixGo", módulo :app).
# O workflow fica na RAIZ (.github/workflows/) e só corre quando algo relevante
# para o Android muda — alterações em api-core/, frontend_web/, pixel_service_v1/,
# tv/, app/ ou src/ não disparam este build.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# Um build por branch/PR: um push novo cancela o anterior ainda em curso.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Todos os comandos `run` executam dentro de android/.
    # ATENÇÃO: isto NÃO afeta `uses:` (cache, upload-artifact) — nesses os
    # caminhos continuam relativos à RAIZ do repositório (por isso
    # `android/app/build/...` no upload do APK).
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AGP 8.5.2 + compileSdk 34. `packages` explícito, sem o pacote legado
      # `tools` (já não existe no repositório do SDK e faz o sdkmanager falhar).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Se android/gradlew não estiver comitado, gera o wrapper 8.7 com a task
      # oficial `wrapper`. Quando o wrapper for comitado, este passo vira no-op.
      - name: Ensure Gradle Wrapper exists (v8.7)
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew ausente no checkout - gerando wrapper 8.7 via task oficial 'wrapper'"
            tmp=$(mktemp -d)
            curl -fsSL -o "$tmp/gradle.zip" \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q "$tmp/gradle.zip" -d "$tmp"
            "$tmp/gradle-8.7/bin/gradle" -p "$PWD" wrapper --gradle-version 8.7
            rm -rf "$tmp"
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile Kotlin (debug)
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Compile Java (debug)
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixgo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
